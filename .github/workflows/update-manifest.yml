name: Update plugin manifest

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]
  push:
    branches: [main]
    paths: [sources.json, scripts/build_manifest.py]

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build combined manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_manifest.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "Manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update plugin manifest"
          git push
